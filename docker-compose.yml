# Docker wale developers ke liye. Windows par Docker ke bina: `pnpm services`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: visitor
      POSTGRES_PASSWORD: visitor
      POSTGRES_DB: visitor_dev
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6380:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visitor
      MINIO_ROOT_PASSWORD: visitor-secret
    ports: ["9000:9000", "9001:9001"]
volumes:
  pgdata:
