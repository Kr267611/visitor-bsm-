# Staging: everything on free plans. Before a real launch, follow the "Launch checklist" in docs/runbook.md.
services:
  - type: web
    name: visitor-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visitor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: visitor-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CONSENT_VERSION
        value: v1
      - key: SMS_PROVIDER
        value: console
      # Until a bucket exists, photos live in memory and are lost on restart. Remove before a real launch.
      - key: STORAGE_DRIVER
        value: memory
      - key: QR_PRIVATE_KEY
        sync: false
      - key: QR_PUBLIC_KEY
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: SMS_SENDER
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Web app. The build deliberately fails without VITE_API_URL.
  - type: web
    name: visitor-web
    runtime: static
    buildCommand: npx pnpm@10.34.9 install --frozen-lockfile --filter web... && npx pnpm@10.34.9 --filter web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /v/*
        name: Referrer-Policy
        value: no-referrer
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false

  - type: keyvalue
    name: visitor-redis
    region: singapore
    plan: free
    # BullMQ jobs must never be evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: visitor-db
    region: singapore
    plan: free
    databaseName: visitor
    user: visitor
